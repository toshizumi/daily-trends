name: 毎朝のトレンド更新

on:
  schedule:
    - cron: "0 21 * * *"  # 日本時間の毎朝6時
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: トレンドを集める
        run: python scripts/collect.py
      - name: 長期データを取り直す（毎月1日と手動実行のとき）
        continue-on-error: true
        run: |
          if [ "$(TZ=Asia/Tokyo date +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/longterm.py
          fi
      - name: データをコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
